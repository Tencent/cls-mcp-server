$:
  tag_push:
    - stages:
      # 使用流水线输出你的构建配置数据
      - name: echo your build data
        script: echo ${CNB_BUILD_USER} 通过 ${CNB_BRANCH} 分支触发了 ${CNB_EVENT} 事件
      - name: get release body from github
        script:
          - while output=$(curl -L -H "Accept:application/vnd.github+json" -H "X-GitHub-Api-Version:2022-11-28" https://api.github.com/repos/Tencent/cls-mcp-server/releases/tags/$CNB_BRANCH); exitCode=$?; ((exitCode != 0)); do sleep 30; done
          - echo "$output" > release.json
          - echo "$(jq '.body' release.json)" > release_body.txt
        timeout: 600000
      - name: set isLatest env
        script:
          - while output=$(curl -L -H "Accept:application/vnd.github+json" -H "X-GitHub-Api-Version:2022-11-28" https://api.github.com/repos/Tencent/cls-mcp-server/releases/latest); exitCode=$?; ((exitCode != 0)); do sleep 30; done
          - echo "$output" > release_latest.json
          - export LATEST_TAG_NAME="$(jq '.tag_name' release_latest.json)"
          - export isLatest="$([[ "$LATEST_TAG_NAME" = "$CNB_BRANCH" ]] && echo true || echo false)"
          - echo "##[set-output isLatest=$isLatest]"
        exports:
          isLatest: isLatest
      - name: upload release
        type: git:release
        options:
          title: $CNB_BRANCH
          descriptionFromFile: release_body.txt
          latest: $isLatest
